# Builds UNWIND as phone apps on GitHub's machines, so no Mac or Android Studio is needed locally.
#  - Android: a debug APK you can download from the run's "Artifacts" and install on an Android phone.
#  - iOS: a full build for the iPhone simulator on a macOS runner. This proves the project compiles;
#    a signed build for TestFlight / the App Store needs an Apple Developer account (see unwind/app/README.md).
name: UNWIND app builds

on:
  push:
    paths: ['unwind/**', '.github/workflows/unwind-app.yml']
  workflow_dispatch:

concurrency:
  group: unwind-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: unwind/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # GitHub's Ubuntu runners come with the Android SDK installed (ANDROID_HOME); Gradle fetches any missing parts.
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unwind-android-debug-apk
          path: unwind/app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    # macOS minutes count 10x against a private repo's free allowance, so this one only
    # runs on request (Actions tab -> "UNWIND app builds" -> Run workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults: { run: { working-directory: unwind/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm ci
      - run: npm run sync
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
