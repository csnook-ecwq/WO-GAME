<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="aureen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="0.5" stop-color="#FAF6EF"/>
      <stop offset="1" stop-color="#F8F2F2"/>
    </linearGradient>

    <!-- Colour gathers in the middle and clears toward the perimeter. -->
    <radialGradient id="wash" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#D37AD6" stop-opacity="0.46"/>
      <stop offset="0.42" stop-color="#D37AD6" stop-opacity="0.38"/>
      <stop offset="0.78" stop-color="#D37AD6" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#D37AD6" stop-opacity="0.09"/>
    </radialGradient>

    <!-- A broad internal reflection across the upper body. -->
    <radialGradient id="bloom" cx="0.40" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

