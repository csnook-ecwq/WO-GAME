    <ellipse cx="-0.238" cy="-0.905" rx="0.036" ry="0.115"
             transform="rotate(-10.9 -0.238 -0.905)" fill="#ffffff" opacity="0.20"/>


    <!-- The default face: dot eyes at 36% down, small curved smile at 45%. -->
