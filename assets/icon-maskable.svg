  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="0.5" stop-color="#FAF5EF"/>
      <stop offset="1" stop-color="#F7F1F3"/>
    </linearGradient>

    <!-- Colour gathers in the middle and clears toward the perimeter. -->
    <radialGradient id="wash" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#CD77CF" stop-opacity="0.46"/>
      <stop offset="0.42" stop-color="#CD77CF" stop-opacity="0.38"/>
      <stop offset="0.78" stop-color="#CD77CF" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#CD77CF" stop-opacity="0.09"/>
    </radialGradient>

