<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="aureen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE6DC"/>
      <stop offset="0.45" stop-color="#FFCBDA"/>
      <stop offset="1" stop-color="#E8D5FF"/>
    </linearGradient>

    <!-- The creature's own colour. Without this she is a white blob on a pink
         square at 60px, which is the size that actually matters. -->
    <radialGradient id="tint" cx="0.44" cy="0.32" r="0.74">
      <stop offset="0" stop-color="#FFF4EF"/>
      <stop offset="0.46" stop-color="#FFC5B2"/>
      <stop offset="1" stop-color="#FF8A6F"/>
    </radialGradient>
    <radialGradient id="tintlimb" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF0E9"/>
      <stop offset="1" stop-color="#FFAE97"/>
    </radialGradient>

    <!-- Soap film: emptier in the middle than at the rim, which is what makes a
         bubble read as a bubble rather than as a shape. -->
    <radialGradient id="film" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.90" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.33" cy="0.26" r="0.8">
      <stop offset="0" stop-color="#FFD6EC" stop-opacity="0.5"/>
      <stop offset="0.38" stop-color="#CEE8FF" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#D6FFE8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFF6CE" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <g transform="translate(256 242) scale(130)">
    <!-- feet, behind -->
    <ellipse cx="-0.23" cy="1.22" rx="0.20" ry="0.12" transform="rotate(-7 -0.23 1.22)"
             fill="url(#tintlimb)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.016"/>
    <ellipse cx="0.23" cy="1.22" rx="0.20" ry="0.12" transform="rotate(7 0.23 1.22)"
             fill="url(#tintlimb)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.016"/>

    <!-- body: tapered at the top, a little wider at the base so she sits.
         Colour first, then the film, then the iridescent wash. -->
    <path d="M0,-1.12 C0.26,-1.12 0.41,-0.88 0.41,-0.52
             C0.41,-0.10 0.52,0.32 0.52,0.74
             C0.52,1.01 0.31,1.13 0,1.13
             C-0.31,1.13 -0.52,1.01 -0.52,0.74
             C-0.52,0.32 -0.41,-0.10 -0.41,-0.52
             C-0.41,-0.88 -0.26,-1.12 0,-1.12 Z" fill="url(#tint)"/>
    <path d="M0,-1.12 C0.26,-1.12 0.41,-0.88 0.41,-0.52
             C0.41,-0.10 0.52,0.32 0.52,0.74
             C0.52,1.01 0.31,1.13 0,1.13
             C-0.31,1.13 -0.52,1.01 -0.52,0.74
             C-0.52,0.32 -0.41,-0.10 -0.41,-0.52
             C-0.41,-0.88 -0.26,-1.12 0,-1.12 Z" fill="url(#film)"/>
    <path d="M0,-1.12 C0.26,-1.12 0.41,-0.88 0.41,-0.52
             C0.41,-0.10 0.52,0.32 0.52,0.74
             C0.52,1.01 0.31,1.13 0,1.13
             C-0.31,1.13 -0.52,1.01 -0.52,0.74
             C-0.52,0.32 -0.41,-0.10 -0.41,-0.52
             C-0.41,-0.88 -0.26,-1.12 0,-1.12 Z" fill="url(#iris)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0.026"/>

    <!-- highlight -->
    <ellipse cx="-0.21" cy="-0.62" rx="0.09" ry="0.055" transform="rotate(-24 -0.21 -0.62)"
             fill="#ffffff" opacity="0.9"/>

    <!-- arms, in front: the seam where they cross the body edge is what makes
         them read as attached -->
    <ellipse cx="-0.44" cy="0.24" rx="0.19" ry="0.155" transform="rotate(-16 -0.44 0.24)"
             fill="url(#tintlimb)" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.018"/>
    <ellipse cx="0.44" cy="0.24" rx="0.19" ry="0.155" transform="rotate(16 0.44 0.24)"
             fill="url(#tintlimb)" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.018"/>

    <!-- face, high on the body -->
    <g fill="#2E2430" fill-opacity="0.82">
      <ellipse cx="-0.19" cy="-0.52" rx="0.055" ry="0.072"/>
      <ellipse cx="0.19" cy="-0.52" rx="0.055" ry="0.072"/>
    </g>
    <path d="M-0.08,-0.35 a0.08,0.08 0 0 0 0.16,0" fill="none"
          stroke="#2E2430" stroke-opacity="0.82" stroke-width="0.045" stroke-linecap="round"/>
  </g>
</svg>
