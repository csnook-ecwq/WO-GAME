<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="bubble">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9CF"/>
      <stop offset="0.45" stop-color="#FFC2D4"/>
      <stop offset="1" stop-color="#E8D5FF"/>
    </linearGradient>

    <!-- One bubble: emptier in the middle than at the rim, the way soap film
         actually reads, with an iridescent wash over the top. -->
    <radialGradient id="film" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.34"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.34" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#FFD6EC" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#CEE8FF" stop-opacity="0.42"/>
      <stop offset="0.72" stop-color="#D6FFE8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFF6CE" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <g>
    <!-- limbs first, so the body and head sit over them -->
    <g opacity="0.95">
      <circle cx="150" cy="300" r="46" fill="url(#film)"/>
      <circle cx="150" cy="300" r="46" fill="url(#iris)"/>
      <circle cx="150" cy="300" r="45" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>

      <circle cx="362" cy="300" r="46" fill="url(#film)"/>
      <circle cx="362" cy="300" r="46" fill="url(#iris)"/>
      <circle cx="362" cy="300" r="45" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>

      <circle cx="200" cy="404" r="37" fill="url(#film)"/>
      <circle cx="200" cy="404" r="37" fill="url(#iris)"/>
      <circle cx="200" cy="404" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>

      <circle cx="312" cy="404" r="37" fill="url(#film)"/>
      <circle cx="312" cy="404" r="37" fill="url(#iris)"/>
      <circle cx="312" cy="404" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
    </g>

    <!-- body -->
    <circle cx="256" cy="310" r="110" fill="url(#film)"/>
    <circle cx="256" cy="310" r="110" fill="url(#iris)"/>
    <circle cx="256" cy="310" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="3.5"/>
    <ellipse cx="216" cy="264" rx="26" ry="18" fill="#ffffff" opacity="0.8" transform="rotate(-28 216 264)"/>

    <!-- head -->
    <circle cx="256" cy="168" r="85" fill="url(#film)"/>
    <circle cx="256" cy="168" r="85" fill="url(#iris)"/>
    <circle cx="256" cy="168" r="83" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3.5"/>
    <ellipse cx="225" cy="132" rx="21" ry="14" fill="#ffffff" opacity="0.85" transform="rotate(-28 225 132)"/>

    <!-- face -->
    <g fill="#2E2430" opacity="0.82">
      <ellipse cx="230" cy="162" rx="9" ry="12"/>
      <ellipse cx="282" cy="162" rx="9" ry="12"/>
    </g>
    <path d="M232 194a26 26 0 0 0 48 0" fill="none" stroke="#2E2430" stroke-opacity="0.82"
          stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
