<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UNWIND">
<title>UNWIND</title>
<style>
:root{
  --bg:#f4f2ec; --bg2:#ebe7dd; --panel:#ffffff; --ink:#18213a; --muted:#6b7385; --line:rgba(24,33,58,.12); --soft:rgba(24,33,58,.06);
  --accent:#2f6df6; --bad:#e5484d; --good:#18a06a; --gold:#f5b301; --flame:#ff6a2b;
  --shadow:0 12px 32px rgba(24,33,58,.12); --press:0 4px 0 rgba(24,33,58,.16);
  --pack:#2f6df6;
}
:root[data-theme="dark"]{
  --bg:#10131a; --bg2:#171b24; --panel:#1c212c; --ink:#eef1f6; --muted:#939cae; --line:rgba(238,241,246,.12); --soft:rgba(238,241,246,.06);
  --accent:#5b8cff; --bad:#ff5d5d; --good:#3cc58e; --shadow:0 12px 32px rgba(0,0,0,.45); --press:0 4px 0 rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.35 ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
.safe-top{padding-top:max(10px,env(safe-area-inset-top))}

/* chunky game buttons */
.btn3d{position:relative;border-radius:18px;background:var(--pack);color:#fff;font-weight:800;letter-spacing:.02em;
  box-shadow:0 5px 0 color-mix(in srgb,var(--pack) 70%,#000),0 10px 24px color-mix(in srgb,var(--pack) 35%,transparent);transition:transform .08s,box-shadow .08s}
.btn3d:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--pack) 70%,#000),0 4px 10px color-mix(in srgb,var(--pack) 30%,transparent)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{transform:translateY(18px);opacity:0}}

/* ---------- top status chips ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:18px;background:var(--panel);box-shadow:0 1px 0 var(--line),0 4px 12px rgba(0,0,0,.05);font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.grow{flex:1}
.round{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--panel);box-shadow:0 1px 0 var(--line),0 4px 12px rgba(0,0,0,.05)}
.round svg{width:20px;height:20px}
.round:active{transform:scale(.94)}

/* ---------- main menu ---------- */
#home{background:radial-gradient(130% 70% at 50% 0%,var(--bg2),var(--bg) 70%)}
#bgfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#home .scroll{position:relative;z-index:1}
.logo{text-align:center;margin:18px 0 6px}
.logo h1{margin:0;font-size:clamp(46px,15vw,72px);line-height:.95;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .mark{width:72px;height:72px;margin:0 auto 10px;filter:drop-shadow(0 6px 14px rgba(232,62,140,.35))}
.logo p{margin:8px 0 0;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.playbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 20px;margin:18px 0 14px;text-align:left;--pack:#2f6df6}
.playbtn .ico{width:52px;height:52px;border-radius:26px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 52px}
.playbtn .ico svg{width:26px;height:26px}
.playbtn b{display:block;font-size:24px;line-height:1.1}
.playbtn small{display:block;font-weight:700;opacity:.88;font-size:13px;margin-top:2px}
.daily-banner{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:20px;text-align:left;margin-bottom:22px;
  background:linear-gradient(120deg,#ff8a3d,#ff5d7a);color:#fff;box-shadow:0 5px 0 #c9455d,0 10px 24px rgba(255,93,122,.35)}
.daily-banner:active{transform:translateY(3px);box-shadow:0 2px 0 #c9455d}
.daily-banner .flame{width:46px;height:46px;border-radius:23px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 46px}
.daily-banner .flame svg{width:26px;height:26px}
.daily-banner b{display:block;font-size:17px}
.daily-banner span{font-size:13px;font-weight:700;opacity:.92}
.daily-banner .dots{display:flex;gap:5px;margin-left:auto}
.daily-banner .dots i{width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.35)}
.daily-banner .dots i.on{background:#fff}
.section{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.section h2{margin:0;font-size:20px;font-weight:900}
.section span{color:var(--muted);font-weight:700;font-size:13px}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:96px}
.pack{position:relative;border-radius:22px;overflow:hidden;background:var(--panel);text-align:left;box-shadow:0 5px 0 color-mix(in srgb,var(--pack) 55%,var(--line)),var(--shadow);transition:transform .1s}
.pack:active{transform:translateY(3px) scale(.99)}
.pack.wide{grid-column:1/-1}
.pack .pv{position:relative;height:132px;background:linear-gradient(160deg,color-mix(in srgb,var(--pack) 16%,var(--panel)),color-mix(in srgb,var(--pack) 6%,var(--panel)))}
.pack.wide .pv{height:150px}
.pack canvas{position:absolute;inset:0;width:100%;height:100%}
.pack .tag{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:10px;background:var(--pack);color:#fff;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.pack .body{padding:10px 12px 12px}
.pack b{display:block;font-size:17px;font-weight:900}
.pack .sub{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:800;color:var(--muted)}
.meter .bar{flex:1;height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px;background:var(--pack)}
.meter svg{width:14px;height:14px}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;gap:4px;padding:6px;border-radius:26px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 1px 0 var(--line),0 12px 30px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;width:72px;padding:7px 0 5px;border-radius:20px;font-size:11px;font-weight:800;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--ink);color:var(--bg)}
.tab:active{transform:scale(.95)}

/* ---------- pack screen ---------- */
.head{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.head h1{margin:0;font-size:26px;font-weight:900;flex:1;min-width:0}
.hero{position:relative;height:170px;border-radius:24px;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--pack) 22%,var(--panel)),color-mix(in srgb,var(--pack) 6%,var(--panel)));box-shadow:0 5px 0 color-mix(in srgb,var(--pack) 50%,var(--line))}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .blurb{position:absolute;left:14px;bottom:12px;right:14px;font-weight:800;color:var(--ink);text-shadow:0 1px 0 var(--panel)}
.diffs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.diffs::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;padding:9px 14px;border-radius:16px;background:var(--panel);font-weight:900;font-size:14px;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.dchip small{display:block;font-size:11px;font-weight:800;opacity:.8}
.dchip.on{background:var(--pack);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--pack) 65%,#000)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.mode{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--panel);font-size:12px;font-weight:900;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.mode svg{width:24px;height:24px}
.mode.on{color:var(--ink);box-shadow:0 0 0 2.5px var(--pack),0 3px 0 var(--line)}
.mode.on svg{color:var(--pack)}
.modehelp{font-size:13px;color:var(--muted);font-weight:600;margin:2px 2px 14px;min-height:18px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;margin-bottom:40px}
.lv{position:relative;aspect-ratio:1/1.08;border-radius:18px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--line)}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .st{display:flex;gap:1px}
.lv .st svg{width:13px;height:13px}
.lv.done{background:var(--pack);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pack) 65%,#000)}
.lv.next{box-shadow:0 0 0 3px var(--pack),0 4px 0 var(--line);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.lv:disabled{opacity:.45;cursor:default;animation:none}
.lv:disabled svg.lock{width:20px;height:20px;color:var(--muted)}
.endless{width:100%;padding:20px;margin-bottom:12px;text-align:left;display:flex;align-items:center;gap:14px}
.endless svg{width:40px;height:40px}
.endless b{display:block;font-size:20px}
.endless small{display:block;font-weight:700;opacity:.9}

/* ---------- daily screen ---------- */
#daily{background:radial-gradient(130% 60% at 50% 0%,color-mix(in srgb,#ff8a3d 16%,var(--bg)),var(--bg) 70%)}
.streak{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--panel);box-shadow:0 4px 0 var(--line),var(--shadow);margin-bottom:14px}
.streak .snum{font-size:40px;font-weight:900;line-height:1}
.streak .flame{width:56px;height:56px;flex:0 0 56px}
.streak .txt b{display:block;font-size:17px}
.streak .txt span{color:var(--muted);font-weight:700;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:900;color:var(--muted)}
.day i{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--soft);font-style:normal;font-size:13px;color:var(--muted)}
.day i svg{width:18px;height:18px}
.day.done i{background:var(--flame);color:#fff}
.day.part i{background:color-mix(in srgb,var(--flame) 35%,var(--panel));color:#fff}
.day.today i{box-shadow:0 0 0 2.5px var(--ink)}
.dcard{display:flex;width:100%;border-radius:22px;overflow:hidden;background:var(--panel);text-align:left;margin-bottom:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--pack) 55%,var(--line)),var(--shadow)}
.dcard:active{transform:translateY(3px)}
.dcard .pv{position:relative;width:118px;flex:0 0 118px;background:linear-gradient(160deg,color-mix(in srgb,var(--pack) 18%,var(--panel)),color-mix(in srgb,var(--pack) 6%,var(--panel)))}
.dcard canvas{position:absolute;inset:0;width:100%;height:100%}
.dcard .body{flex:1;padding:14px;min-width:0}
.dcard .k{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--pack)}
.dcard b{display:block;font-size:19px;font-weight:900;margin:2px 0}
.dcard .sub{font-size:13px;color:var(--muted);font-weight:700}
.dcard .go{margin-top:10px;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:var(--pack);color:#fff;font-weight:900;font-size:13px}
.dcard.done .go{background:var(--good)}
.countdown{text-align:center;color:var(--muted);font-weight:800;margin:6px 0 110px;font-variant-numeric:tabular-nums}

/* ---------- game ---------- */
#game{background:var(--bg)}
.ghud{display:flex;align-items:center;gap:8px;padding-left:12px;padding-right:12px}
.gtitle{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.gtitle .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:14px;background:var(--pack);color:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 0 color-mix(in srgb,var(--pack) 65%,#000);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle span{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap}
.status{display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px;font-weight:800;color:var(--muted);min-height:26px;padding:6px 12px 0;font-variant-numeric:tabular-nums}
.status .chipi{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;background:var(--panel);box-shadow:0 2px 0 var(--line)}
.hearts{display:flex;gap:3px}
.hearts svg{width:20px;height:20px}
.prog{height:6px;background:var(--soft);margin:8px 16px 0;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pack);width:0;border-radius:3px;transition:width .3s}
#stage{position:relative;flex:1;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{display:flex;justify-content:center;gap:10px;padding:8px 10px max(12px,env(safe-area-inset-bottom))}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:800;width:62px}
.tool .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--panel);box-shadow:0 4px 0 var(--line),0 6px 14px rgba(0,0,0,.06);transition:transform .08s}
.tool .ic svg{width:24px;height:24px;color:var(--ink)}
.tool:active .ic{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tool:disabled{opacity:.35}
.tool.on .ic{background:var(--pack)}
.tool.on .ic svg{color:#fff}
.tool.hint .ic{background:var(--gold)}
.tool.hint .ic svg{color:#3b2a00}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:3}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);font-weight:800;z-index:4;background:var(--bg)}
.loading.on{display:flex}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--pack);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(10,14,24,.42);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.veil.on{display:flex}
@media (min-width:700px){.veil{align-items:center}}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:26px;padding:22px 18px max(18px,env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .3s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:900;text-align:center}
.sheet p{color:var(--muted);margin:0 0 14px;text-align:center;font-weight:600}
.sheet .left{text-align:left}
.big{width:100%;height:54px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.big.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.big.packc{background:var(--pack);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pack) 65%,#000)}
.row{display:flex;gap:10px}
.row+.row,.big+.row,.row+.big{margin-top:10px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:6px 0 10px}
.stars svg{width:58px;height:58px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.stars svg:nth-child(2){width:74px;height:74px}
.stars .s{animation:starpop .5s cubic-bezier(.2,1.7,.4,1) both}
.stars .s:nth-child(2){animation-delay:.18s}.stars .s:nth-child(3){animation-delay:.36s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:900}
.set{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;font-weight:700}
.set:last-of-type{border-bottom:0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:6px 10px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 50px;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--good)}
.sw.on::after{left:23px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.swatch{width:28px;height:28px;border-radius:14px;box-shadow:inset 0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.chipb{padding:8px 12px;border-radius:12px;background:var(--soft);font-weight:800}
.small{font-size:12px;color:var(--muted);font-weight:600}
table.recs{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.recs td{padding:7px 2px;border-bottom:1px solid var(--line);font-weight:700}
table.recs td:last-child{text-align:right;font-variant-numeric:tabular-nums}
/* tutorial coach bubble */
.coach{position:absolute;left:12px;right:12px;top:10px;z-index:3;display:none;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--panel);box-shadow:0 4px 0 var(--line),var(--shadow);animation:rise .4s both}
.coach.on{display:flex}
.coach div{flex:1;min-width:0}
.coach b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pack);font-weight:900}
.coach p{margin:2px 0 0;font-weight:800;font-size:15px}
.coach button{flex:0 0 auto;padding:8px 12px;border-radius:12px;background:var(--soft);font-weight:800;font-size:13px;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
</style>
</head>
<body>

<!-- ======================= MAIN MENU ======================= -->
<section id="home" class="screen on">
  <canvas id="bgfx"></canvas>
  <div class="scroll safe-top">
    <div class="wrap">
      <div class="topbar">
        <div class="pill" title="Stars"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L2.9 9.4l6.3-.9z" fill="var(--gold)"/></svg><span id="starCount">0</span></div>
        <div class="pill" title="Daily streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.6 5 10.4A5 5 0 0 1 12 22a5 5 0 0 1-5-5c0-2.5 1.3-3.6 2.4-4.8.2 1.4.9 2.3 1.9 2.6C10.6 11 11 6 12 2z" fill="var(--flame)"/></svg><span id="streakCount">0</span></div>
        <div class="grow"></div>
        <button class="round" id="homeSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>

      <div class="logo rise">
        <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="markg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#e83e8c"/></linearGradient></defs>
          <rect width="1024" height="1024" rx="230" fill="url(#markg)"/>
          <path d="M300 250V560a212 212 0 0 0 424 0V330c0-70 -96-70 -96 0v190" fill="none" stroke="#fff" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="752" cy="800" r="58" fill="#ffe14d"/></svg>
        <h1>UNWIND</h1>
        <p>Untangle every arrow</p>
      </div>

      <button class="playbtn btn3d rise" id="playBtn"><div class="ico"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#fff"/></svg></div><div><b id="playTitle">Play</b><small id="playSub"></small></div></button>

      <button class="daily-banner rise" id="dailyBanner">
        <div class="flame"><svg viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.6 5 10.4A5 5 0 0 1 12 22a5 5 0 0 1-5-5c0-2.5 1.3-3.6 2.4-4.8.2 1.4.9 2.3 1.9 2.6C10.6 11 11 6 12 2z" fill="#fff"/></svg></div>
        <div><b>Daily challenges</b><span id="dailyBannerSub"></span></div>
        <div class="dots" id="dailyDots"></div>
      </button>

      <div class="section"><h2>Puzzles</h2><span id="packsSub"></span></div>
      <div class="packs" id="packs"></div>
    </div>
  </div>
</section>

<!-- ======================= PACK (a puzzle type) ======================= -->
<section id="pack" class="screen">
  <div class="scroll safe-top">
    <div class="wrap">
      <div class="head">
        <button class="round" id="packBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h1 id="packTitle"></h1>
        <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L2.9 9.4l6.3-.9z" fill="var(--gold)"/></svg><span id="packStars">0</span></div>
      </div>
      <div class="hero"><canvas id="packHero"></canvas><div class="blurb" id="packBlurb"></div></div>
      <div class="label">Difficulty</div>
      <div class="diffs" id="diffs"></div>
      <div class="label">Mode</div>
      <div class="modes" id="modes"></div>
      <div class="modehelp" id="modeHelp"></div>
      <div id="levelArea"></div>
    </div>
  </div>
</section>

<!-- ======================= DAILY ======================= -->
<section id="daily" class="screen">
  <div class="scroll safe-top">
    <div class="wrap">
      <div class="head">
        <button class="round" id="dailyBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h1>Daily challenges</h1>
      </div>
      <div class="streak"><svg class="flame" viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.6 5 10.4A5 5 0 0 1 12 22a5 5 0 0 1-5-5c0-2.5 1.3-3.6 2.4-4.8.2 1.4.9 2.3 1.9 2.6C10.6 11 11 6 12 2z" fill="var(--flame)"/></svg>
        <div class="snum" id="streakBig">0</div><div class="txt"><b>day streak</b><span id="streakTxt"></span></div></div>
      <div class="week" id="week"></div>
      <div id="dailyCards"></div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
</section>

<!-- tab bar (menu screens) -->
<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Play</button>
  <button class="tab" data-tab="daily"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Daily</button>
  <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</nav>

<!-- ======================= GAME ======================= -->
<section id="game" class="screen">
  <div class="ghud safe-top">
    <button class="round" id="backBtn" aria-label="Back to menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="gtitle"><div class="badge" id="gTitle"></div><span id="gSub"></span></div>
    <button class="round" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>
  <div class="status" id="status"></div>
  <div class="prog"><i id="progBar"></i></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="coach" id="coach"><div><b></b><p></p></div><button id="coachSkip">Skip</button></div>
    <div class="loading" id="loading"><div class="spin"></div><div id="loadingText">Untangling…</div></div>
  </div>
  <div class="tools">
    <button class="tool" id="undoBtn"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></div>Undo</button>
    <button class="tool hint" id="hintBtn"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></div>Hint</button>
    <button class="tool" id="gridBtn"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 4 7 20M17 4l-2 16M4 9h16M3 15h16"/></svg></div>Grid</button>
    <button class="tool" id="viewBtn"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></div><span>Fit</span></button>
    <button class="tool" id="restartBtn"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></div>Restart</button>
  </div>
</section>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<canvas id="confetti"></canvas>

<script>
/*@ENGINE@*/
</script>
<script>
/*@APP@*/
</script>
</body>
</html>
